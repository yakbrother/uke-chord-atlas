<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Tap frets on an interactive ukulele fretboard and instantly identify the chord (GCEA tuning).">
<title>Chord Identifier — Uke Chord Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/identify.css">
<script>
  (function () {
    try {
      const saved = localStorage.getItem('uca-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="app">

  <header>
    <div class="header-top">
      <h1>Uke Chord Atlas</h1>
      <span class="subtitle">chord identifier · GCEA</span>
    </div>
    <div class="header-controls">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme">
        <span class="icon-light" aria-hidden="true">&#9790;</span>
        <span class="icon-dark" aria-hidden="true">&#9728;</span>
      </button>
    </div>

    <nav class="site-nav" aria-label="Site navigation">
      <a href="index.html">Atlas</a>
      <a href="identify.html" aria-current="page">Identifier</a>
    </nav>
  </header>

  <main class="identify-layout">
    <div>
      <div id="fretboard-container" aria-label="Interactive fretboard — click to select frets">
        <!-- SVG rendered by JS -->
      </div>
      <button type="button" class="clear-btn" id="clear-btn">Clear all</button>
    </div>

    <div id="identify-result" aria-live="polite">
      <!-- filled by JS -->
    </div>
  </main>

</div>

<script src="js/music-theory.js"></script>
<script src="js/theme.js"></script>
<script src="js/identify.js"></script>
</body>
</html>
