<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:">
<meta name="description" content="Browse curated chord progressions in any key, see each chord's diagram and scale tones, and step through sequences like flipping cards.">
<meta name="author" content="Tim Eaton">
<title>Progressions — Uke Chord Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/progressions.css">
<link rel="stylesheet" href="css/print.css" media="print">
<script>
  // Resolve theme before first paint to avoid a flash of the wrong theme.
  (function () {
    try {
      const saved = localStorage.getItem('uca-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { /* localStorage may be unavailable */ }
  })();
</script>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<div id="app">

  <header>
    <div class="header-top">
      <h1>Uke Chord Atlas</h1>
      <span class="subtitle">progression decks · all keys</span>
    </div>
    <div class="header-controls">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme">
        <span class="icon-light" aria-hidden="true">&#9790;</span>
        <span class="icon-dark" aria-hidden="true">&#9728;</span>
      </button>
    </div>

    <div class="nav-row">
      <nav class="site-nav" aria-label="Site navigation">
        <a href="index.html">Atlas</a>
        <a href="identify.html">Identifier</a>
        <a href="progressions.html" aria-current="page">Progressions</a>
      </nav>
      <div class="tuning-toggle" id="tuning-toggle" role="group" aria-label="Tuning">
        <!-- filled by JS -->
      </div>
    </div>
  </header>

  <main id="main-content" class="progressions-layout" aria-live="polite">
    <!-- Deck list view (default) -->
    <section id="deck-list-view" class="view active">
      <div class="deck-grid" id="deck-grid">
        <!-- Deck cards populated by JS -->
      </div>
    </section>

    <!-- Card viewer view -->
    <section id="card-viewer" class="view" aria-hidden="true">
      <div class="viewer-header">
        <button type="button" class="back-btn" id="back-to-decks" aria-label="Back to deck list">
          ← Back to Decks
        </button>
        <div class="viewer-info" id="viewer-info">
          <!-- Deck title and progression info populated by JS -->
        </div>
      </div>

      <div class="card-container" id="card-container">
        <!-- Card front -->
        <div class="card-face front" id="card-front">
          <div class="card-chord-sequence" id="chord-sequence">
            <!-- Chord names displayed here -->
          </div>
          <div class="card-roman" id="card-roman">
            <!-- Roman numerals displayed here -->
          </div>
          <div class="card-pattern-name" id="pattern-name">
            <!-- Pattern name displayed here -->
          </div>
        </div>

        <!-- Card back -->
        <div class="card-face back" id="card-back" aria-hidden="true">
          <div class="diagram-strip" id="diagram-strip">
            <!-- Chord diagrams displayed here -->
          </div>
          <div class="scale-tones-section" id="scale-tones-section">
            <!-- Scale tones info displayed here -->
          </div>
        </div>
      </div>

      <div class="card-controls">
        <button type="button" class="control-btn" id="flip-btn" aria-label="Flip card to show diagrams">
          Show Diagrams
        </button>
        <div class="step-controls">
          <button type="button" class="control-btn step-btn" id="prev-btn" aria-label="Previous progression">
            ← Prev
          </button>
          <span class="step-counter" id="step-counter">1 of 1</span>
          <button type="button" class="control-btn step-btn" id="next-btn" aria-label="Next progression">
            Next →
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <p>&copy; 2025 Tim Eaton. All rights reserved.</p>
    <p class="footer-links">
      <a href="https://timeaton.dev" rel="noopener noreferrer">timeaton.dev</a>
      <span aria-hidden="true">&middot;</span>
      <a href="https://mostlytrue.life" rel="noopener noreferrer">mostlytrue.life</a>
    </p>
  </footer>

</div>

<script src="js/music-theory.js"></script>
<script src="js/diagram.js"></script>
<script src="js/theme.js"></script>
<script src="js/tuning.js"></script>
<script src="js/progression-data.js"></script>
<script src="js/progressions.js"></script>
</body>
</html>
