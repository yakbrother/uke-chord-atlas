<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A soundless reference for ukulele chord voicings across all 12 keys (GCEA tuning).">
<title>Uke Chord Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<script>
  // Resolve theme before first paint to avoid a flash of the wrong theme.
  (function () {
    try {
      const saved = localStorage.getItem('uca-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { /* localStorage may be unavailable */ }
  })();
</script>
<style>
  :root {
    --bg: #15100a;
    --surface: #f0e8d0;
    --surface-2: #e0d4b0;
    --surface-3: #e8dcc0;
    --text: #1a1209;
    --text-muted: #8a6a35;
    --border: #c8a870;
    --accent: #8b3a1c;
    --accent-text: #f0e8d0;
    --focus: #2f6585;

    --diagram-bg: #f4ead2;
    --diagram-bg-active: #e6d2a8;
    --diagram-line: rgba(139,115,70,0.12);
    --diagram-strong: #4a3520;
    --diagram-fret: rgba(74,53,32,0.25);
    --diagram-string: rgba(74,53,32,0.5);
    --diagram-dot: #3a2510;
    --diagram-dot-text: #f4ead2;
    --diagram-open: #2f6585;
    --diagram-muted-text: #7a6232;
  }

  [data-theme="dark"] {
    --bg: #0d0b09;
    --surface: #1c1813;
    --surface-2: #262019;
    --surface-3: #221d16;
    --text: #ece2cc;
    --text-muted: #c2a76e;
    --border: #4a3d28;
    --accent: #e08a56;
    --accent-text: #1c1813;
    --focus: #8fc0df;

    --diagram-bg: #221c14;
    --diagram-bg-active: #342818;
    --diagram-line: rgba(200,170,110,0.10);
    --diagram-strong: #c7ad7a;
    --diagram-fret: rgba(200,170,110,0.32);
    --diagram-string: rgba(200,170,110,0.58);
    --diagram-dot: #e6cf95;
    --diagram-dot-text: #221c14;
    --diagram-open: #8fc0df;
    --diagram-muted-text: #c2a76e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Libre Baskerville', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text);
  }

  /* Grain texture overlay (decorative) */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.5;
  }

  #app {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--surface);
    min-height: 100vh;
    position: relative;
    box-shadow: 0 0 80px rgba(0,0,0,0.8);
  }

  /* Aged panel edges (decorative) */
  #app::before, #app::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 8px;
    background: linear-gradient(to right, rgba(0,0,0,0.12), transparent);
    z-index: 2;
    pointer-events: none;
  }
  #app::before { left: 0; }
  #app::after { right: 0; background: linear-gradient(to left, rgba(0,0,0,0.12), transparent); }

  /* Header */
  header {
    padding: 36px 40px 24px;
    border-bottom: 2px solid var(--border);
    position: relative;
    background: linear-gradient(to bottom, var(--surface-3), var(--surface));
  }

  .header-top {
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    padding-right: 60px;
  }

  h1 {
    font-family: 'Special Elite', cursive;
    font-size: clamp(28px, 5vw, 48px);
    color: var(--text);
    letter-spacing: 2px;
    line-height: 1;
  }

  .subtitle {
    font-style: italic;
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* Theme toggle */
  .theme-toggle {
    position: absolute;
    top: 20px; right: 40px;
    width: 44px; height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    line-height: 1;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .theme-toggle:hover { background: var(--surface-2); }
  .theme-toggle .icon-dark { display: none; }
  [data-theme="dark"] .theme-toggle .icon-light { display: none; }
  [data-theme="dark"] .theme-toggle .icon-dark { display: inline; }

  /* Selectors */
  fieldset {
    border: none;
    margin: 0;
    padding: 0;
  }
  legend {
    font-family: 'Special Elite', cursive;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .key-row {
    display: flex;
    gap: 0;
    flex-wrap: wrap;
    margin-top: 20px;
  }

  .key-btn {
    font-family: 'Special Elite', cursive;
    font-size: 16px;
    padding: 10px 14px;
    min-height: 44px;
    border: 1px solid var(--border);
    border-right: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
    letter-spacing: 1px;
    position: relative;
  }
  .key-btn:last-child { border-right: 1px solid var(--border); }
  .key-btn:hover { background: var(--surface-2); }
  .key-btn[aria-pressed="true"] {
    background: var(--text);
    color: var(--surface);
    border-color: var(--text);
    z-index: 1;
  }

  /* Chord type row */
  .type-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
    padding: 16px 40px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .type-row legend {
    width: 100%;
  }

  .type-btn {
    font-family: 'Special Elite', cursive;
    font-size: 13px;
    padding: 8px 12px;
    min-height: 40px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
    letter-spacing: 0.5px;
  }
  .type-btn:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
  .type-btn[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  .mixed-btn {
    margin-left: auto;
    font-style: italic;
    border-style: dashed;
    color: var(--accent);
    border-color: var(--accent);
  }
  .mixed-btn[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-text);
  }

  /* Content area */
  #chord-content {
    padding: 28px 40px 80px;
    min-height: 400px;
  }

  .chord-group {
    margin-bottom: 32px;
  }

  .group-label {
    font-family: 'Special Elite', cursive;
    font-size: 16px;
    color: var(--text);
    letter-spacing: 3px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
    margin-bottom: 14px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .group-count {
    font-family: 'Libre Baskerville', serif;
    font-size: 11px;
    font-style: italic;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 1px;
    text-transform: lowercase;
  }

  .voicings-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* Chord card */
  .chord-card {
    cursor: pointer;
    transition: transform 0.1s;
    position: relative;
    padding: 0;
    border: none;
    background: transparent;
    line-height: 0;
    border-radius: 4px;
  }
  .chord-card:hover { transform: translateY(-2px); }
  .chord-card[aria-pressed="true"] { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 60%, transparent)); }
  .chord-card[aria-pressed="true"] svg rect.d-bg { fill: var(--diagram-bg-active); }

  /* Diagram theming via classes */
  .chord-card svg rect.d-bg { fill: var(--diagram-bg); }
  .chord-card svg .d-paper-line { stroke: var(--diagram-line); }
  .chord-card svg .d-nut { fill: var(--diagram-strong); }
  .chord-card svg .d-fret { stroke: var(--diagram-fret); }
  .chord-card svg .d-string { stroke: var(--diagram-string); }
  .chord-card svg .d-pos { fill: var(--diagram-muted-text); }
  .chord-card svg .d-label { fill: var(--diagram-muted-text); }
  .chord-card svg .d-open { fill: none; stroke: var(--diagram-open); }
  .chord-card svg .d-open-text { fill: var(--diagram-open); }
  .chord-card svg .d-dot { fill: var(--diagram-dot); }
  .chord-card svg .d-dot-text { fill: var(--diagram-dot-text); }
  .chord-card.mixed svg .d-open { stroke: var(--accent); }
  .chord-card.mixed svg .d-open-text { fill: var(--accent); }
  .chord-card.mixed svg .d-dot { fill: var(--accent); }

  /* Empty state */
  .empty {
    font-style: italic;
    color: var(--text-muted);
    font-size: 15px;
    padding: 40px 0;
    text-align: center;
  }

  /* Detail strip */
  .info-strip {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%) translateY(100%);
    background: var(--text);
    color: var(--surface);
    font-size: 12px;
    font-family: 'Special Elite', cursive;
    letter-spacing: 2px;
    padding: 8px 22px;
    transition: transform 0.25s;
    white-space: nowrap;
    max-width: 92vw;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 100;
    border-radius: 4px 4px 0 0;
  }
  .info-strip.show { transform: translateX(-50%) translateY(0); }

  /* Visible focus for keyboard users */
  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 600px) {
    header { padding: 24px 16px 20px; }
    .header-top { padding-right: 52px; }
    .theme-toggle { top: 16px; right: 16px; }
    #chord-content { padding: 20px 16px 80px; }
    .type-row { padding: 12px 16px; }
    h1 { font-size: 30px; }
    .key-btn { font-size: 15px; padding: 10px 12px; }
    .voicings-grid { justify-content: space-between; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="header-top">
      <h1>Uke Chord Atlas</h1>
      <span class="subtitle">all keys · all voicings · GCEA</span>
    </div>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme">
      <span class="icon-light" aria-hidden="true">☾</span>
      <span class="icon-dark" aria-hidden="true">☀</span>
    </button>

    <fieldset class="key-fieldset">
      <legend>Key</legend>
      <div class="key-row" id="key-row" role="group" aria-label="Select key">
        <!-- filled by JS -->
      </div>
    </fieldset>
  </header>

  <fieldset class="type-row" id="type-row">
    <legend>Chord type</legend>
    <!-- filled by JS -->
  </fieldset>

  <main id="chord-content" aria-live="polite">
    <div class="empty">Select a key above to begin.</div>
  </main>

</div>

<div class="info-strip" id="info-strip" role="status" aria-live="polite"></div>

<script>
// ═══════════════════════════════════════════════════════════
// MUSIC THEORY ENGINE
// ═══════════════════════════════════════════════════════════

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const NOTE_NAMES_FLAT = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
// Keys that prefer flats
const FLAT_KEYS = new Set([1,3,5,8,10]); // Db,Eb,F,Ab,Bb

function noteName(n, root) {
  const nn = ((n % 12) + 12) % 12;
  if (FLAT_KEYS.has(root)) return NOTE_NAMES_FLAT[nn];
  return NOTE_NAMES[nn];
}

// GCEA open string notes (semitones, C=0)
const OPEN = [7, 0, 4, 9]; // G C E A
const STRING_NAMES_UKE = ["G","C","E","A"];

function noteAt(str, fret) { return (OPEN[str] + fret) % 12; }

// Chord type definitions — intervals from root
const CHORD_TYPES = [
  { id:"maj",    label:"maj",       tones:[0,4,7]       },
  { id:"min",    label:"min",       tones:[0,3,7]       },
  { id:"sus2",   label:"sus2",      tones:[0,2,7]       },
  { id:"sus4",   label:"sus4",      tones:[0,5,7]       },
  { id:"add9",   label:"add9",      tones:[0,4,7,2]     },
  { id:"6",      label:"6",         tones:[0,4,7,9]     },
  { id:"69",     label:"6/9",       tones:[0,4,7,9,2]   },
  { id:"7",      label:"7",         tones:[0,4,7,10]    },
  { id:"maj7",   label:"maj7",      tones:[0,4,7,11]    },
  { id:"9",      label:"9",         tones:[0,4,7,10,2]  },
  { id:"maj9",   label:"maj9",      tones:[0,4,7,11,2]  },
  { id:"m7",     label:"m7",        tones:[0,3,7,10]    },
  { id:"mmaj7",  label:"m(maj7)",   tones:[0,3,7,11]    },
  { id:"m9",     label:"m9",        tones:[0,3,7,10,2]  },
  { id:"7sus4",  label:"7sus4",     tones:[0,5,7,10]    },
  { id:"add11",  label:"add11",     tones:[0,4,5,7]     },
];

function isMixed(frets) {
  return frets.some(f=>f===0) && frets.some(f=>f>0);
}

// Generate all voicings for a given root
function generateVoicings(root) {
  const results = [];
  const seen = new Set();

  for (let s0=0; s0<=12; s0++)
  for (let s1=0; s1<=12; s1++)
  for (let s2=0; s2<=12; s2++)
  for (let s3=0; s3<=12; s3++) {
    const frets = [s0,s1,s2,s3];
    const pressed = frets.filter(f=>f>0);
    if (pressed.length > 0) {
      const lo = Math.min(...pressed), hi = Math.max(...pressed);
      if (hi-lo > 3) continue;
    }
    const notes = frets.map((f,i) => noteAt(i,f));
    const ivs = new Set(notes.map(n => ((n-root)+12)%12));
    if (!ivs.has(0)) continue;

    for (const ct of CHORD_TYPES) {
      const full = new Set(ct.tones);
      // A 4-string uke can sound at most 4 distinct tones. For extended
      // chords the perfect 5th is the conventional omission, so it becomes
      // optional while every other chord tone stays required.
      const required = ct.tones.length > 4
        ? new Set(ct.tones.filter(t => t !== 7))
        : full;
      if (![...required].every(r=>ivs.has(r))) continue;
      const allOk = notes.every(n => full.has(((n-root)+12)%12));
      if (!allOk) continue;
      const key = ct.id + ":" + frets.join(",");
      if (seen.has(key)) continue;
      seen.add(key);
      results.push({ type:ct.id, label:ct.label, frets:[...frets], notes });
    }
  }
  return results;
}

// Cache voicings per root
const voicingCache = {};
function getVoicings(root) {
  if (!voicingCache[root]) voicingCache[root] = generateVoicings(root);
  return voicingCache[root];
}

// ═══════════════════════════════════════════════════════════
// SVG CHORD DIAGRAM
// ═══════════════════════════════════════════════════════════

function chordSVG(frets, noteNamesArr, root, mixed) {
  const W=82, H=112;
  const STRINGS=4, FRETS_SHOWN=5;
  const lm=16, tm=30, rm=6;
  const gw=W-lm-rm, gh=H-tm-18;
  const ss=gw/(STRINGS-1), fs=gh/FRETS_SHOWN;

  const pressed=frets.filter(f=>f>0);
  const minFret=pressed.length>0?Math.min(...pressed):0;
  const startFret=minFret>1?minFret:1;
  const showNut=startFret===1;

  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">`;

  // bg
  s += `<rect class="d-bg" x="0" y="0" width="${W}" height="${H}" rx="3"/>`;

  // aged paper lines
  for (let i=0;i<3;i++) {
    s += `<line class="d-paper-line" x1="0" y1="${tm+18+i*22}" x2="${W}" y2="${tm+18+i*22}" stroke-width="0.5"/>`;
  }

  // Fret position marker
  if (startFret>1) {
    s += `<text class="d-pos" x="${lm-3}" y="${tm+fs*0.65}" text-anchor="end" font-size="8" font-family="'Special Elite',serif">${startFret}</text>`;
  }

  // Nut
  if (showNut) {
    s += `<rect class="d-nut" x="${lm-1}" y="${tm-4}" width="${gw+2}" height="4" rx="1"/>`;
  }

  // Fret lines
  for (let fi=0;fi<=FRETS_SHOWN;fi++) {
    if (fi===0 && showNut) continue;
    s += `<line class="d-fret" x1="${lm}" y1="${tm+fi*fs}" x2="${lm+gw}" y2="${tm+fi*fs}" stroke-width="0.8"/>`;
  }

  // Strings
  for (let si=0;si<STRINGS;si++) {
    s += `<line class="d-string" x1="${lm+si*ss}" y1="${tm}" x2="${lm+si*ss}" y2="${tm+gh}" stroke-width="${1+si*0.15}"/>`;
  }

  // Open circles
  frets.forEach((f,si) => {
    if (f!==0) return;
    const cx=lm+si*ss, cy=tm-10;
    s += `<circle class="d-open" cx="${cx}" cy="${cy}" r="5" stroke-width="1.5"/>`;
    s += `<text class="d-open-text" x="${cx}" y="${cy+3.5}" text-anchor="middle" font-size="5.5" font-weight="bold" font-family="monospace">${noteNamesArr[si]}</text>`;
  });

  // Finger dots
  frets.forEach((f,si) => {
    if (f<=0) return;
    const fr=f-startFret+1;
    const cy=tm+(fr-0.5)*fs;
    const cx=lm+si*ss;
    s += `<circle class="d-dot" cx="${cx}" cy="${cy}" r="${fs*0.38}"/>`;
    s += `<text class="d-dot-text" x="${cx}" y="${cy+3}" text-anchor="middle" font-size="6" font-weight="bold" font-family="monospace">${noteNamesArr[si]}</text>`;
  });

  // String labels
  STRING_NAMES_UKE.forEach((sn,si) => {
    s += `<text class="d-label" x="${lm+si*ss}" y="${H-2}" text-anchor="middle" font-size="7" font-family="'Libre Baskerville',serif">${sn}</text>`;
  });

  s += `</svg>`;
  return s;
}

// Build a spoken-friendly description of a voicing for screen readers.
function voicingAriaLabel(grpLabel, noteNamesArr, frets) {
  const fingering = frets.map((f, si) => {
    const str = STRING_NAMES_UKE[si];
    return f === 0 ? `${str} open` : `${str} fret ${f}`;
  }).join(', ');
  return `${grpLabel} voicing. Notes ${noteNamesArr.join(', ')}. Fingering ${fingering}.`;
}

// ═══════════════════════════════════════════════════════════
// SELECTION / DETAIL STRIP
// ═══════════════════════════════════════════════════════════

let currentCard = null;

function selectCard(cardEl, noteNamesArr, frets) {
  if (currentCard === cardEl) {
    clearSelection();
    return;
  }
  if (currentCard) currentCard.setAttribute('aria-pressed', 'false');
  currentCard = cardEl;
  cardEl.setAttribute('aria-pressed', 'true');

  const fingering = frets.map((f, si) => `${STRING_NAMES_UKE[si]}${f}`).join(' ');
  showInfo(`${noteNamesArr.join(' · ')}  —  ${fingering}`);
}

function clearSelection() {
  if (currentCard) {
    currentCard.setAttribute('aria-pressed', 'false');
    currentCard = null;
  }
  hideInfo();
}

function showInfo(text) {
  const strip = document.getElementById('info-strip');
  strip.textContent = text;
  strip.classList.add('show');
}
function hideInfo() {
  const strip = document.getElementById('info-strip');
  strip.classList.remove('show');
  strip.textContent = '';
}

// ═══════════════════════════════════════════════════════════
// UI STATE
// ═══════════════════════════════════════════════════════════

const KEYS = [
  {root:0,label:"C"}, {root:1,label:"C#/Db"}, {root:2,label:"D"},
  {root:3,label:"D#/Eb"},{root:4,label:"E"}, {root:5,label:"F"},
  {root:6,label:"F#/Gb"},{root:7,label:"G"}, {root:8,label:"G#/Ab"},
  {root:9,label:"A"}, {root:10,label:"A#/Bb"},{root:11,label:"B"},
];

let state = {
  root: null,
  type: "all",
  mixedOnly: false,
};

// Render key buttons
function renderKeys() {
  const row = document.getElementById('key-row');
  row.innerHTML = KEYS.map(k => `
    <button type="button" class="key-btn" aria-pressed="${state.root===k.root}"
      data-root="${k.root}">${k.label}</button>
  `).join('');
}

// Render type buttons
function renderTypes() {
  const row = document.getElementById('type-row');
  const types = [
    {id:"all", label:"All"},
    ...CHORD_TYPES.map(ct => ({id:ct.id, label:ct.label}))
  ];
  row.innerHTML = `<legend>Chord type</legend>` + types.map(t => `
    <button type="button" class="type-btn" aria-pressed="${state.type===t.id}"
      data-type="${t.id}">${t.label}</button>
  `).join('') + `
    <button type="button" class="type-btn mixed-btn" aria-pressed="${state.mixedOnly}"
      data-mixed="true">★ open mid-neck</button>
  `;
}

// Render chord content
function renderContent() {
  const content = document.getElementById('chord-content');
  clearSelection();

  if (state.root === null) {
    content.innerHTML = `<div class="empty">Select a key above to begin.</div>`;
    return;
  }

  const root = state.root;
  let voicings = getVoicings(root);

  // Filter by type
  if (state.type !== "all") {
    voicings = voicings.filter(v => v.type === state.type);
  }

  // Filter by mixed
  if (state.mixedOnly) {
    voicings = voicings.filter(v => isMixed(v.frets));
  }

  // Sort by position
  voicings = voicings.slice().sort((a,b) => {
    const pa = a.frets.filter(f=>f>0);
    const pb = b.frets.filter(f=>f>0);
    const posA = pa.length>0?Math.min(...pa):0;
    const posB = pb.length>0?Math.min(...pb):0;
    return posA-posB;
  });

  // Group by label
  const groups = {};
  for (const v of voicings) {
    const lbl = rootNoteName(root) + (v.label==='maj'?'':v.label);
    if (!groups[lbl]) groups[lbl] = [];
    groups[lbl].push(v);
  }

  if (voicings.length === 0) {
    content.innerHTML = `<div class="empty">No voicings found for this selection.</div>`;
    return;
  }

  let html = '';
  for (const [grpLabel, vs] of Object.entries(groups)) {
    html += `<div class="chord-group">`;
    html += `<div class="group-label">${grpLabel} <span class="group-count">${vs.length} voicing${vs.length!==1?'s':''}</span></div>`;
    html += `<div class="voicings-grid">`;
    vs.forEach((v) => {
      const mixed = isMixed(v.frets);
      const noteNamesArr = v.notes.map(n => noteName(n, root));
      const svg = chordSVG(v.frets, noteNamesArr, root, mixed);
      const fretData = JSON.stringify(v.frets);
      const noteData = JSON.stringify(noteNamesArr);
      const ariaLabel = voicingAriaLabel(grpLabel, noteNamesArr, v.frets);
      html += `<button type="button" class="chord-card${mixed?' mixed':''}"
        aria-pressed="false"
        aria-label="${ariaLabel}"
        data-frets='${fretData}' data-notes='${noteData}'
        title="${noteNamesArr.join('-')} | frets: ${v.frets.join('-')}"
      >${svg}</button>`;
    });
    html += `</div></div>`;
  }

  content.innerHTML = html;
}

function rootNoteName(root) {
  if (FLAT_KEYS.has(root)) return NOTE_NAMES_FLAT[root];
  return NOTE_NAMES[root];
}

function selectKey(root) {
  state.root = root;
  renderKeys();
  renderContent();
}

function selectType(type) {
  state.type = type;
  renderTypes();
  renderContent();
}

function toggleMixed() {
  state.mixedOnly = !state.mixedOnly;
  renderTypes();
  renderContent();
}

// ═══════════════════════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════════════════════

function currentTheme() {
  return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const toggle = document.getElementById('theme-toggle');
  toggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
  try { localStorage.setItem('uca-theme', theme); } catch (e) { /* ignore */ }
}

function toggleTheme() {
  applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
}

// ═══════════════════════════════════════════════════════════
// EVENT WIRING
// ═══════════════════════════════════════════════════════════

document.addEventListener('DOMContentLoaded', () => {
  renderKeys();
  renderTypes();
  renderContent();
  applyTheme(currentTheme());

  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

  document.getElementById('key-row').addEventListener('click', e => {
    const btn = e.target.closest('.key-btn');
    if (btn) selectKey(Number(btn.dataset.root));
  });

  document.getElementById('type-row').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.mixed) { toggleMixed(); return; }
    if (btn.dataset.type) selectType(btn.dataset.type);
  });

  document.getElementById('chord-content').addEventListener('click', e => {
    const card = e.target.closest('.chord-card');
    if (!card) return;
    selectCard(card, JSON.parse(card.dataset.notes), JSON.parse(card.dataset.frets));
  });

  // Precompute a few common keys in the background
  setTimeout(() => {
    [0,2,5,7,9].forEach(r => getVoicings(r));
  }, 500);
});

// Keyboard shortcut: Escape clears the current selection
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') clearSelection();
});
</script>
