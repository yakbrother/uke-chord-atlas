<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uke Chord Atlas — Drone Edition</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.3/htmx.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1209;
    --paper: #f0e8d0;
    --paper-dark: #e0d4b0;
    --aged: #c8a870;
    --rust: #8b3a1c;
    --drone-active: #5a1a02;
    --faint: rgba(26,18,9,0.15);
    --string-col: rgba(26,18,9,0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ink);
    font-family: 'Libre Baskerville', Georgia, serif;
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* Grain texture overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.6;
  }

  #app {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--paper);
    min-height: 100vh;
    position: relative;
    box-shadow: 0 0 80px rgba(0,0,0,0.8);
  }

  /* Aged paper edges */
  #app::before, #app::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 8px;
    background: linear-gradient(to right, rgba(0,0,0,0.12), transparent);
    z-index: 2;
  }
  #app::before { left: 0; }
  #app::after { right: 0; background: linear-gradient(to left, rgba(0,0,0,0.12), transparent); }

  /* Header */
  header {
    padding: 36px 40px 24px;
    border-bottom: 2px solid var(--aged);
    position: relative;
    background: linear-gradient(to bottom, #e8dcc0, var(--paper));
  }

  .header-top {
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }

  h1 {
    font-family: 'Special Elite', cursive;
    font-size: clamp(28px, 5vw, 48px);
    color: var(--ink);
    letter-spacing: 2px;
    line-height: 1;
  }

  .subtitle {
    font-style: italic;
    font-size: 13px;
    color: var(--aged);
    letter-spacing: 1px;
  }

  .drone-indicator {
    position: absolute;
    top: 20px; right: 40px;
    font-family: 'Special Elite', cursive;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--aged);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .drone-indicator.active {
    opacity: 1;
    color: var(--rust);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Key selector */
  .key-row {
    display: flex;
    gap: 0;
    flex-wrap: wrap;
    margin-top: 20px;
  }

  .key-btn {
    font-family: 'Special Elite', cursive;
    font-size: 16px;
    padding: 8px 14px;
    border: 1px solid var(--aged);
    border-right: none;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.1s;
    letter-spacing: 1px;
    position: relative;
  }
  .key-btn:last-child { border-right: 1px solid var(--aged); }
  .key-btn:hover { background: var(--paper-dark); }
  .key-btn.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    z-index: 1;
  }

  /* Chord type row */
  .type-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 16px 40px;
    background: var(--paper-dark);
    border-bottom: 1px solid var(--aged);
  }

  .type-btn {
    font-family: 'Special Elite', cursive;
    font-size: 12px;
    padding: 4px 10px;
    border: 1px solid rgba(26,18,9,0.3);
    border-radius: 2px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.12s;
    letter-spacing: 0.5px;
  }
  .type-btn:hover { background: rgba(26,18,9,0.08); }
  .type-btn.active {
    background: var(--rust);
    color: var(--paper);
    border-color: var(--rust);
  }

  .mixed-btn {
    margin-left: auto;
    font-style: italic;
    border-style: dashed;
    color: var(--rust);
    border-color: var(--rust);
  }
  .mixed-btn.active {
    background: var(--rust);
    color: var(--paper);
  }

  /* Content area */
  #chord-content {
    padding: 28px 40px 60px;
    min-height: 400px;
  }

  .chord-group {
    margin-bottom: 32px;
  }

  .group-label {
    font-family: 'Special Elite', cursive;
    font-size: 15px;
    color: var(--ink);
    letter-spacing: 3px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--aged);
    padding-bottom: 6px;
    margin-bottom: 14px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .group-count {
    font-family: 'Libre Baskerville', serif;
    font-size: 10px;
    font-style: italic;
    color: var(--aged);
    font-weight: 400;
    letter-spacing: 1px;
    text-transform: lowercase;
  }

  .voicings-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* Chord card */
  .chord-card {
    cursor: pointer;
    transition: transform 0.1s;
    position: relative;
  }
  .chord-card:hover { transform: translateY(-2px); }
  .chord-card.playing svg rect.card-bg { fill: #2a1005; }
  .chord-card.playing { filter: drop-shadow(0 0 8px rgba(139,58,28,0.6)); }

  /* Empty state */
  .empty {
    font-style: italic;
    color: var(--aged);
    font-size: 14px;
    padding: 40px 0;
    text-align: center;
  }

  /* Stop button */
  #stop-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    font-family: 'Special Elite', cursive;
    font-size: 13px;
    padding: 10px 20px;
    background: var(--rust);
    color: var(--paper);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.2s;
    pointer-events: none;
  }
  #stop-btn.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
  }

  /* Info strip */
  .info-strip {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--aged);
    font-size: 10px;
    font-family: 'Special Elite', cursive;
    letter-spacing: 2px;
    padding: 4px 20px;
    opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap;
    pointer-events: none;
    z-index: 100;
  }
  .info-strip.show { opacity: 1; }

  @media (max-width: 600px) {
    header, #chord-content { padding-left: 16px; padding-right: 16px; }
    .type-row { padding: 12px 16px; }
    h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="header-top">
      <h1>Uke Chord Atlas</h1>
      <span class="subtitle">all keys · all voicings · drone edition · GCEA</span>
    </div>
    <div class="drone-indicator" id="drone-indicator">◉ drone sounding</div>

    <div class="key-row" id="key-row">
      <!-- filled by JS -->
    </div>
  </header>

  <div class="type-row" id="type-row">
    <!-- filled by JS -->
  </div>

  <div id="chord-content">
    <div class="empty">Select a key above to begin.</div>
  </div>

</div>

<button id="stop-btn" onclick="stopAll()">■ STOP</button>
<div class="info-strip" id="info-strip"></div>

<script>
// ═══════════════════════════════════════════════════════════
// MUSIC THEORY ENGINE
// ═══════════════════════════════════════════════════════════

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const NOTE_NAMES_FLAT = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
// Keys that prefer flats
const FLAT_KEYS = new Set([1,3,5,8,10]); // Db,Eb,F,Ab,Bb

function noteName(n, root) {
  const nn = ((n % 12) + 12) % 12;
  if (FLAT_KEYS.has(root)) return NOTE_NAMES_FLAT[nn];
  return NOTE_NAMES[nn];
}

// GCEA open string notes (semitones, C=0)
const OPEN = [7, 0, 4, 9]; // G C E A
const STRING_NAMES_UKE = ["G","C","E","A"];

function noteAt(str, fret) { return (OPEN[str] + fret) % 12; }

// Chord type definitions — intervals from root
const CHORD_TYPES = [
  { id:"maj",    label:"maj",       tones:[0,4,7]       },
  { id:"min",    label:"min",       tones:[0,3,7]       },
  { id:"sus2",   label:"sus2",      tones:[0,2,7]       },
  { id:"sus4",   label:"sus4",      tones:[0,5,7]       },
  { id:"add9",   label:"add9",      tones:[0,4,7,2]     },
  { id:"6",      label:"6",         tones:[0,4,7,9]     },
  { id:"69",     label:"6/9",       tones:[0,4,7,9,2]   },
  { id:"7",      label:"7",         tones:[0,4,7,10]    },
  { id:"maj7",   label:"maj7",      tones:[0,4,7,11]    },
  { id:"9",      label:"9",         tones:[0,4,7,10,2]  },
  { id:"maj9",   label:"maj9",      tones:[0,4,7,11,2]  },
  { id:"m7",     label:"m7",        tones:[0,3,7,10]    },
  { id:"mmaj7",  label:"m(maj7)",   tones:[0,3,7,11]    },
  { id:"m9",     label:"m9",        tones:[0,3,7,10,2]  },
  { id:"7sus4",  label:"7sus4",     tones:[0,5,7,10]    },
  { id:"add11",  label:"add11",     tones:[0,4,5,7]     },
];

function isMixed(frets) {
  return frets.some(f=>f===0) && frets.some(f=>f>0);
}

// Generate all voicings for a given root
function generateVoicings(root) {
  const results = [];
  const seen = new Set();

  for (let s0=0; s0<=12; s0++)
  for (let s1=0; s1<=12; s1++)
  for (let s2=0; s2<=12; s2++)
  for (let s3=0; s3<=12; s3++) {
    const frets = [s0,s1,s2,s3];
    const pressed = frets.filter(f=>f>0);
    if (pressed.length > 0) {
      const lo = Math.min(...pressed), hi = Math.max(...pressed);
      if (hi-lo > 3) continue;
    }
    const notes = frets.map((f,i) => noteAt(i,f));
    const ivs = new Set(notes.map(n => ((n-root)+12)%12));
    if (!ivs.has(0)) continue;

    for (const ct of CHORD_TYPES) {
      const req = new Set(ct.tones);
      if (![...req].every(r=>ivs.has(r))) continue;
      const allOk = notes.every(n => req.has(((n-root)+12)%12));
      if (!allOk) continue;
      const key = ct.id + ":" + frets.join(",");
      if (seen.has(key)) continue;
      seen.add(key);
      results.push({ type:ct.id, label:ct.label, frets:[...frets], notes });
    }
  }
  return results;
}

// Cache voicings per root
const voicingCache = {};
function getVoicings(root) {
  if (!voicingCache[root]) voicingCache[root] = generateVoicings(root);
  return voicingCache[root];
}

// ═══════════════════════════════════════════════════════════
// SVG CHORD DIAGRAM
// ═══════════════════════════════════════════════════════════

function chordSVG(frets, noteNamesArr, root, mixed) {
  const W=82, H=112;
  const STRINGS=4, FRETS_SHOWN=5;
  const lm=16, tm=30, rm=6;
  const gw=W-lm-rm, gh=H-tm-18;
  const ss=gw/(STRINGS-1), fs=gh/FRETS_SHOWN;

  const pressed=frets.filter(f=>f>0);
  const minFret=pressed.length>0?Math.min(...pressed):0;
  const startFret=minFret>1?minFret:1;
  const showNut=startFret===1;

  let s = `<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`;

  // bg
  s += `<rect class="card-bg" x="0" y="0" width="${W}" height="${H}" rx="3" fill="#f4ead2"/>`;

  // aged paper lines
  for (let i=0;i<3;i++) {
    s += `<line x1="0" y1="${tm+18+i*22}" x2="${W}" y2="${tm+18+i*22}" stroke="rgba(139,115,70,0.12)" stroke-width="0.5"/>`;
  }

  // Fret position marker
  if (startFret>1) {
    s += `<text x="${lm-3}" y="${tm+fs*0.65}" text-anchor="end" font-size="8" fill="#8b7244" font-family="'Special Elite',serif">${startFret}</text>`;
  }

  // Nut
  if (showNut) {
    s += `<rect x="${lm-1}" y="${tm-4}" width="${gw+2}" height="4" rx="1" fill="#4a3520"/>`;
  }

  // Fret lines
  for (let fi=0;fi<=FRETS_SHOWN;fi++) {
    if (fi===0 && showNut) continue;
    s += `<line x1="${lm}" y1="${tm+fi*fs}" x2="${lm+gw}" y2="${tm+fi*fs}" stroke="rgba(74,53,32,0.25)" stroke-width="0.8"/>`;
  }

  // Strings
  for (let si=0;si<STRINGS;si++) {
    s += `<line x1="${lm+si*ss}" y1="${tm}" x2="${lm+si*ss}" y2="${tm+gh}" stroke="rgba(74,53,32,0.5)" stroke-width="${1+si*0.15}"/>`;
  }

  // Open circles
  frets.forEach((f,si) => {
    if (f!==0) return;
    const cx=lm+si*ss, cy=tm-10;
    s += `<circle cx="${cx}" cy="${cy}" r="5" fill="none" stroke="${mixed?'#8b3a1c':'#4a7a9b'}" stroke-width="1.5"/>`;
    s += `<text x="${cx}" y="${cy+3.5}" text-anchor="middle" font-size="5.5" fill="${mixed?'#8b3a1c':'#4a7a9b'}" font-weight="bold" font-family="monospace">${noteNamesArr[si]}</text>`;
  });

  // Finger dots
  frets.forEach((f,si) => {
    if (f<=0) return;
    const fr=f-startFret+1;
    const cy=tm+(fr-0.5)*fs;
    const cx=lm+si*ss;
    s += `<circle cx="${cx}" cy="${cy}" r="${fs*0.38}" fill="${mixed?'#8b3a1c':'#3a2510'}"/>`;
    s += `<text x="${cx}" y="${cy+3}" text-anchor="middle" font-size="6" fill="${mixed?'#f4ead2':'#f4ead2'}" font-weight="bold" font-family="monospace">${noteNamesArr[si]}</text>`;
  });

  // String labels
  STRING_NAMES_UKE.forEach((sn,si) => {
    s += `<text x="${lm+si*ss}" y="${H-2}" text-anchor="middle" font-size="7" fill="#8b7244" font-family="'Libre Baskerville',serif">${sn}</text>`;
  });

  s += `</svg>`;
  return s;
}

// ═══════════════════════════════════════════════════════════
// AUDIO ENGINE
// ═══════════════════════════════════════════════════════════

let audioCtx = null;
let activeNodes = [];
let currentCard = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// Frequency for a note at a given fret on a given string
// GCEA: G4=392Hz, C4=261.63Hz, E4=329.63Hz, A4=440Hz
const STRING_BASE_FREQS = [392.00, 261.63, 329.63, 440.00];

function fretFreq(str, fret) {
  return STRING_BASE_FREQS[str] * Math.pow(2, fret/12);
}

// Drone sound: mix of sine + triangle for each string
// Slight vibrato, slightly detuned harmonics — like a resonating open instrument
function playDrone(frets, noteNamesArr, cardEl) {
  stopAll();
  currentCard = cardEl;
  cardEl.classList.add('playing');

  const ctx = getAudioCtx();
  const masterGain = ctx.createGain();
  masterGain.gain.setValueAtTime(0, ctx.currentTime);
  masterGain.gain.linearRampToValueAtTime(0.55, ctx.currentTime + 0.4);
  masterGain.connect(ctx.destination);

  // Reverb via convolver approximation (simple delay network)
  const convolver = ctx.createConvolver();
  const bufLen = ctx.sampleRate * 2.5;
  const impulse = ctx.createBuffer(2, bufLen, ctx.sampleRate);
  for (let ch=0;ch<2;ch++) {
    const d = impulse.getChannelData(ch);
    for (let i=0;i<bufLen;i++) {
      d[i] = (Math.random()*2-1) * Math.pow(1-i/bufLen, 2.2);
    }
  }
  convolver.buffer = impulse;
  const wetGain = ctx.createGain();
  wetGain.gain.value = 0.25;
  masterGain.connect(convolver);
  convolver.connect(wetGain);
  wetGain.connect(ctx.destination);

  // Compressor for warmth
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18;
  comp.knee.value = 8;
  comp.ratio.value = 3;
  comp.attack.value = 0.01;
  comp.release.value = 0.3;
  comp.connect(masterGain);

  activeNodes.push(masterGain, wetGain, comp);

  frets.forEach((fret, si) => {
    if (fret < 0) return; // muted
    const freq = fretFreq(si, fret);

    // Each string: sine + triangle + slight harmonics
    const waveTypes = ['sine', 'triangle'];
    waveTypes.forEach((type, wi) => {
      const osc = ctx.createOscillator();
      osc.type = type;
      // Slight per-string detuning for that drone resonance
      const detune = (si * 1.3) + (wi * 0.7) + (Math.random() * 0.5 - 0.25);
      osc.frequency.value = freq * (wi===0 ? 1 : 2); // triangle at octave for body
      osc.detune.value = detune;

      // Vibrato
      const vibratoOsc = ctx.createOscillator();
      vibratoOsc.type = 'sine';
      vibratoOsc.frequency.value = 4.5 + si * 0.3; // slight difference per string
      const vibratoGain = ctx.createGain();
      vibratoGain.gain.value = 2.5;
      vibratoOsc.connect(vibratoGain);
      vibratoGain.connect(osc.detune);

      const strGain = ctx.createGain();
      // Triangle/harmonic is quieter; strings balance
      const baseVol = wi===0 ? 0.18 : 0.06;
      // Open strings ring slightly louder
      const openBoost = fret===0 ? 1.3 : 1.0;
      strGain.gain.value = baseVol * openBoost;
      strGain.connect(comp);

      osc.connect(strGain);
      osc.start();
      vibratoOsc.start();

      activeNodes.push(osc, vibratoOsc, vibratoGain, strGain);
    });

    // Pluck attack: brief sharper transient
    const pluck = ctx.createOscillator();
    pluck.type = 'sawtooth';
    pluck.frequency.value = freq * 2;
    const pluckGain = ctx.createGain();
    pluckGain.gain.setValueAtTime(0.08, ctx.currentTime);
    pluckGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3 + si*0.04);
    pluck.connect(pluckGain);
    pluckGain.connect(comp);
    pluck.start();
    pluck.stop(ctx.currentTime + 0.35);
    activeNodes.push(pluck, pluckGain);
  });

  document.getElementById('stop-btn').classList.add('visible');
  document.getElementById('drone-indicator').classList.add('active');

  // Show note info
  showInfo(noteNamesArr);
}

function stopAll() {
  const ctx = audioCtx;
  if (ctx) {
    activeNodes.forEach(n => {
      try {
        if (n.gain) {
          n.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
        } else if (n.stop) {
          n.stop(ctx.currentTime + 0.4);
        }
      } catch(e) {}
    });
  }
  activeNodes = [];
  if (currentCard) { currentCard.classList.remove('playing'); currentCard = null; }
  document.getElementById('stop-btn').classList.remove('visible');
  document.getElementById('drone-indicator').classList.remove('active');
  hideInfo();
}

function showInfo(noteNamesArr) {
  const strip = document.getElementById('info-strip');
  strip.textContent = noteNamesArr.join(' · ');
  strip.classList.add('show');
}
function hideInfo() {
  document.getElementById('info-strip').classList.remove('show');
}

// ═══════════════════════════════════════════════════════════
// UI STATE
// ═══════════════════════════════════════════════════════════

const KEYS = [
  {root:0,label:"C"}, {root:1,label:"C#/Db"}, {root:2,label:"D"},
  {root:3,label:"D#/Eb"},{root:4,label:"E"}, {root:5,label:"F"},
  {root:6,label:"F#/Gb"},{root:7,label:"G"}, {root:8,label:"G#/Ab"},
  {root:9,label:"A"}, {root:10,label:"A#/Bb"},{root:11,label:"B"},
];

let state = {
  root: null,
  type: "all",
  mixedOnly: false,
};

// Render key buttons
function renderKeys() {
  const row = document.getElementById('key-row');
  row.innerHTML = KEYS.map(k => `
    <button class="key-btn${state.root===k.root?' active':''}"
      onclick="selectKey(${k.root})">${k.label}</button>
  `).join('');
}

// Render type buttons
function renderTypes() {
  const row = document.getElementById('type-row');
  const types = [
    {id:"all", label:"All"},
    ...CHORD_TYPES.map(ct => ({id:ct.id, label:ct.label}))
  ];
  row.innerHTML = types.map(t => `
    <button class="type-btn${state.type===t.id?' active':''}"
      onclick="selectType('${t.id}')">${t.label}</button>
  `).join('') + `
    <button class="type-btn mixed-btn${state.mixedOnly?' active':''}"
      onclick="toggleMixed()">★ open mid-neck</button>
  `;
}

// Render chord content
function renderContent() {
  const content = document.getElementById('chord-content');
  if (state.root === null) {
    content.innerHTML = `<div class="empty">Select a key above to begin.</div>`;
    return;
  }

  const root = state.root;
  let voicings = getVoicings(root);

  // Filter by type
  if (state.type !== "all") {
    voicings = voicings.filter(v => v.type === state.type);
  }

  // Filter by mixed
  if (state.mixedOnly) {
    voicings = voicings.filter(v => isMixed(v.frets));
  }

  // Sort by position
  voicings.sort((a,b) => {
    const pa = a.frets.filter(f=>f>0);
    const pb = b.frets.filter(f=>f>0);
    const posA = pa.length>0?Math.min(...pa):0;
    const posB = pb.length>0?Math.min(...pb):0;
    return posA-posB;
  });

  // Group by label
  const groups = {};
  for (const v of voicings) {
    const lbl = rootNoteName(root) + (v.label==='maj'?'':v.label);
    if (!groups[lbl]) groups[lbl] = [];
    groups[lbl].push(v);
  }

  if (voicings.length === 0) {
    content.innerHTML = `<div class="empty">No voicings found for this selection.</div>`;
    return;
  }

  let html = '';
  for (const [grpLabel, vs] of Object.entries(groups)) {
    html += `<div class="chord-group">`;
    html += `<div class="group-label">${grpLabel} <span class="group-count">${vs.length} voicing${vs.length!==1?'s':''}</span></div>`;
    html += `<div class="voicings-grid">`;
    vs.forEach((v,i) => {
      const mixed = isMixed(v.frets);
      const noteNamesArr = v.notes.map(n => noteName(n, root));
      const svg = chordSVG(v.frets, noteNamesArr, root, mixed);
      const freqData = JSON.stringify(v.frets);
      const noteData = JSON.stringify(noteNamesArr);
      html += `<div class="chord-card${mixed?' mixed':''}" 
        onclick="handleCardClick(this, ${freqData}, ${noteData})"
        title="${noteNamesArr.join('-')} | frets: ${v.frets.join('-')}"
      >${svg}</div>`;
    });
    html += `</div></div>`;
  }

  content.innerHTML = html;
}

function rootNoteName(root) {
  if (FLAT_KEYS.has(root)) return NOTE_NAMES_FLAT[root];
  return NOTE_NAMES[root];
}

// ─── HTMX-style dynamic swap using hx-swap-oob equivalent
// We simulate HTMX partial updates by targeting specific elements
function selectKey(root) {
  stopAll();
  state.root = root;
  renderKeys();
  renderContent();
}

function selectType(type) {
  state.type = type;
  renderTypes();
  renderContent();
}

function toggleMixed() {
  state.mixedOnly = !state.mixedOnly;
  renderTypes();
  renderContent();
}

function handleCardClick(cardEl, frets, noteNamesArr) {
  if (cardEl.classList.contains('playing')) {
    stopAll();
    return;
  }
  playDrone(frets, noteNamesArr, cardEl);
}

// ─── HTMX integration: intercept requests and handle locally
// We use htmx's event system to hook into our state
document.addEventListener('DOMContentLoaded', () => {
  renderKeys();
  renderTypes();
  renderContent();

  // Precompute a few common keys in background
  setTimeout(() => {
    [0,2,5,7,9].forEach(r => getVoicings(r));
  }, 500);
});

// Keyboard shortcut: Escape to stop
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') stopAll();
});
</script>

</body>
</html>
