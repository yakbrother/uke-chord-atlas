<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;">
<meta name="description" content="Tap frets on an interactive resonator guitar fretboard and instantly identify the chord — Open D and Open Dm tuning, mutable strings.">
<meta name="author" content="Tim Eaton">
<title>Chord Identifier — Reso Chord Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/identify.css">
<link rel="stylesheet" href="css/print.css" media="print">
<script>
  (function () {
    try {
      const saved = localStorage.getItem('rca-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
</head>
<body>
<a href="#fretboard-container" class="skip-link">Skip to main content</a>
<div id="app">

  <header>
    <div class="header-top">
      <h1>Reso Chord Atlas</h1>
      <span class="subtitle">chord identifier · open tunings</span>
    </div>
    <div class="header-controls">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme">
        <span class="icon-light" aria-hidden="true">&#9790;</span>
        <span class="icon-dark" aria-hidden="true">&#9728;</span>
      </button>
    </div>

    <div class="nav-row">
      <nav class="site-nav" aria-label="Site navigation">
        <a href="index.html">Atlas</a>
        <a href="identify.html" aria-current="page">Identifier</a>
        <a href="progressions.html">Progressions</a>
      </nav>
      <a href="../../html/public/identify.html" class="app-switch-link">&#8592; Uke Chord Atlas</a>
      <div class="tuning-toggle" id="tuning-toggle" role="group" aria-label="Tuning">
        <!-- filled by JS -->
      </div>
    </div>
  </header>

  <main class="identify-layout">
    <div>
      <div id="fretboard-container" role="application" aria-label="Interactive resonator guitar fretboard — click to select frets, click the top row to mute a string">
        <!-- SVG rendered by JS -->
      </div>
      <button type="button" class="clear-btn" id="clear-btn">Clear all</button>
    </div>

    <div id="identify-result" aria-live="polite">
      <!-- filled by JS -->
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <p>&copy; 2025 Tim Eaton. All rights reserved.</p>
    <p class="footer-links">
      <a href="https://timeaton.dev" rel="noopener noreferrer">timeaton.dev</a>
      <span aria-hidden="true">&middot;</span>
      <a href="https://mostlytrue.life" rel="noopener noreferrer">mostlytrue.life</a>
    </p>
  </footer>

</div>

<script src="js/instrument.js"></script>
<script src="js/music-theory.js"></script>
<script src="js/theme.js"></script>
<script src="js/tuning.js"></script>
<script src="js/identify.js"></script>
</body>
</html>
